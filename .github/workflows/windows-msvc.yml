name: Windows MSVC Workflow

on:
  pull_request:
    branches: [ gitside-master ]
  push:
  workflow_dispatch:

env:
  GC_VERSION: GnuCOBOL 4.0-dev

  FLEXBISON: https://github.com/lexxmark/winflexbison/releases/download/v2.5.25/win_flex_bison-2.5.25.zip

  VCPKG_ROOT: C:\vcpkg
  VCPKGS: mpir pdcurses berkeleydb libxml2 cjson

  MSYS2_ROOT: C:\msys64
  MSYSTEM: UCRT64
  MSYSPKGS: autoconf

defaults:
  run:
    shell: cmd

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25   # usually around 6-9 minutes when everything cached, 16-21 minutes otherwise
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86
          - x64
        target:
          - Debug
          - Release

    steps:

      - name: Set git user
        run: |
          git config --global user.name github-actions
          git config --global user.email github-actions-bot@users.noreply.github.com

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup build environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -property installationPath
          $msbuild = Join-Path $installPath "MSBuild\Current\Bin\MSBuild.exe"
          if ("${{ matrix.arch }}" -eq "x86") {
            $vcvars = Join-Path $installPath "VC\Auxiliary\Build\vcvars32.bat"
            $vcpkgs = $env:VCPKGS -replace '(\S+)', '$1:x86-windows'
            $archdir = "Win32"
          } else {
            $vcvars = Join-Path $installPath "VC\Auxiliary\Build\vcvars64.bat"
            $vcpkgs = $env:VCPKGS -replace '(\S+)', '$1:x64-windows'
            $archdir = "x64"
          }
          echo MSBUILD=$msbuild >> $env:GITHUB_ENV
          echo VCVARS=$vcvars >> $env:GITHUB_ENV
          echo VCPKGS=$vcpkgs >> $env:GITHUB_ENV
          echo ARCHDIR=$archdir >> $env:GITHUB_ENV

      - name: Restore VCPKG cache
        id: restore-vcpkg
        uses: actions/cache/restore@v6
        with:
          key: cache-vcpkg-${{ matrix.arch }}-${{ matrix.target }}
          path: |
            ${{ env.VCPKG_ROOT }}/installed
            ${{ env.VCPKG_ROOT }}/packages

      - name: Bootstrap VCPKG
        run: |
          cd /d "%VCPKG_ROOT%"
          git pull
          cmd /C .\bootstrap-vcpkg.bat -disableMetrics
          vcpkg update

      - name: Integrate VCPKG
        run: vcpkg integrate install

      - name: Install VCPKG packages
        # note: always done to update the cache as-needed
        run: vcpkg install %VCPKGS%

      - name: Save VCPKG cache
        uses: actions/cache/save@v6
        with:
          key: cache-vcpkg-${{ matrix.arch }}-${{ matrix.target }}
          path: |
            ${{ env.VCPKG_ROOT }}/installed
            ${{ env.VCPKG_ROOT }}/packages

      - name: Restore WinFlexBison cache
        uses: actions/cache/restore@v6
        id: restore-flexbison
        with:
          key: cache-flexbison-${{ matrix.arch }}-${{ matrix.target }}
          path: flexbison

      - name: Install WinFlexBison
        if: steps.restore-flexbison.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri $env:FLEXBISON -OutFile flexbison.zip
          Expand-Archive flexbison.zip -DestinationPath flexbison

      - name: Save WinFlexBison cache
        if: steps.restore-flexbison.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          key: cache-flexbison-${{ matrix.arch }}-${{ matrix.target }}
          path: flexbison

      - name: Configure GnuCOBOL
        shell: pwsh
        run: |
          cd build_windows
          (('#define COB_MAIN_DIR "' + $env:GITHUB_WORKSPACE + '"') -replace '\\', '\\') + "`r`n" + `
          ((Get-Content -Path 'config.h.in' | ForEach-Object { $_ `
              -replace '(#define\s+CONFIGURED_ISAM)\s.+$', '$1   BDB' `
              -replace '(#define\s+CONFIGURED_CURSES)\s.+$', '$1 PDCURSES' `
              -replace '(#define\s+CONFIGURED_XML)\s.+$', '$1    XML2' `
              -replace '(#define\s+CONFIGURED_JSON)\s.+$', '$1   CJSON_CJSON' `
              -replace '"\(" PACKAGE_NAME "\) "', '"(GnuCOBOL-CI ${{ matrix.target }}) "' `
            }) -join "`r`n") | Set-Content -Path 'config.h'
          & .\maketarstamp.ps1 > tarstamp.h

      - name: Disable iconv for debug builds
        if: ${{ matrix.target == 'Debug' }}
        shell: pwsh
        run: |
          cd build_windows
          ((Get-Content -Path 'config.h' | ForEach-Object { $_ `
              -replace '(#define\s+HAVE_ICONV)\s.+$', '/* #undef HAVE_ICONV */' `
            }) -join "`r`n") | Set-Content -Path 'config.h'

      - name: Generate parser
        run: |
          set PATH=%GITHUB_WORKSPACE%\flexbison;%PATH%
          cmd /C .\build_windows\makebisonflex.cmd <NUL

      - name: Build GnuCOBOL
        run: |
          cd build_windows
          rem Needed so libxml headers can be found
          set CL=/I "%VCPKG_ROOT%\installed\${{ matrix.arch }}-windows\include\libxml2"
          "%MSBUILD%" .\vs2019\GnuCOBOL.sln /m /p:Platform=${{ matrix.arch }} /p:Configuration=${{ matrix.target }}

      - name: Install MSYS2 packages
        shell: C:\shells\msys2bash.cmd {0}
        run: pacman --needed --noconfirm -S $MSYSPKGS

      - name: Adjust testsuite
        shell: C:\shells\msys2bash.cmd {0}
        run: |
          cd tests/testsuite.src

          # Depends on target-specific memory layout
          sed -i '/AT_SETUP(\[runtime check: write to internal storage (1)\])/a AT_SKIP_IF(\[true\])' run_misc.at

          # The following 22 fail in Release Mode
          sed -i '/AT_SETUP(\[Large BINARY, COMP-X\])/a AT_SKIP_IF(\[true\])' run_misc.at
          sed -i '/AT_SETUP(\[Test dump feature (4)\])/a AT_SKIP_IF(\[true\])' run_misc.at
          sed -i '/AT_SETUP(\[C-API (3)\])/a AT_SKIP_IF(\[true\])' run_misc.at
          sed -i '/AT_SETUP(\[C API Test JUST\])/a AT_SKIP_IF(\[true\])' run_misc.at
          sed -i '/AT_SETUP(\[Test COBOL-C interface\])/a AT_SKIP_IF(\[true\])' run_misc.at
          sed -i '/AT_SETUP(\[Test COBOL-C interface (2)\])/a AT_SKIP_IF(\[true\])' run_misc.at
          sed -i '/AT_SETUP(\[OUTPUT on INDEXED file to missing directory\])/a AT_SKIP_IF(\[true\])' run_file.at
          sed -i '/AT_SETUP(\[INDEXED file SUPPRESS WHEN ALL + KEYCHECK\])/a AT_SKIP_IF(\[true\])' run_file.at
          sed -i '/AT_SETUP(\[INDEXED undeclared keys\])/a AT_SKIP_IF(\[true\])' run_file.at
          sed -i '/AT_SETUP(\[EXTFH: using ISAM callback\])/a AT_SKIP_IF(\[true\])' run_file.at
          sed -i '/AT_SETUP(\[trace feature\])/a AT_SKIP_IF(\[true\])' run_file.at
          sed -i '/AT_SETUP(\[trace feature with indexed EXTFH\])/a AT_SKIP_IF(\[true\])' run_file.at
          sed -i '/AT_SETUP(\[trace feature with subroutine\])/a AT_SKIP_IF(\[true\])' run_file.at
          sed -i '/AT_SETUP(\[PIPE I\/O\])/a AT_SKIP_IF(\[true\])' run_file.at
          sed -i '/AT_SETUP(\[STDOUT STDERR I\/O\])/a AT_SKIP_IF(\[true\])' run_file.at
          sed -i '/AT_SETUP(\[INDEXED COMMIT\/ROLLBACK\])/a AT_SKIP_IF(\[true\])' run_file.at
          sed -i '/AT_SETUP(\[SEQUENTIAL\/RELATIVE COMMIT\/ROLLBACK\])/a AT_SKIP_IF(\[true\])' run_file.at
          sed -i '/AT_SETUP(\[LINE SEQUENTIAL COMMIT \/ ROLLBACK\])/a AT_SKIP_IF(\[true\])' run_file.at
          sed -i '/AT_SETUP(\[OPEN OUTPUT COMMIT \/ ROLLBACK\])/a AT_SKIP_IF(\[true\])' run_file.at
          sed -i '/AT_SETUP(\[MF io status (indexed)\])/a AT_SKIP_IF(\[true\])' run_file.at
          sed -i '/AT_SETUP(\[Test MF Status (sequential)\])/a AT_SKIP_IF(\[true\])' run_file.at
          sed -i '/AT_SETUP(\[LINE SEQUENTIAL\])/a AT_SKIP_IF(\[true\])' run_file.at

          # The following 4 fail in Debug Mode
          sed -i '/AT_SETUP(\[C-API (field based)\])/a AT_SKIP_IF(\[true\])' run_misc.at
          sed -i '/AT_SETUP(\[SEQUENTIAL basic I\/O\])/a AT_SKIP_IF(\[true\])' run_file.at
          sed -i '/AT_SETUP(\[LINE SEQUENTIAL one Record\])/a AT_SKIP_IF(\[true\])' run_file.at
          sed -i '/AT_SETUP(\[System routine CBL_GC_HOSTED\])/a AT_SKIP_IF(\[true\])' run_extensions.at

      - name: Build testsuite
        shell: C:\shells\msys2bash.cmd {0}
        run: |
          cd tests
          echo at_testdir=\'tests\' > atconfig
          echo abs_builddir=\'$(pwd)\' >> atconfig
          echo at_srcdir=\'tests\' >> atconfig
          echo abs_srcdir=\'$(pwd)\' >> atconfig
          echo at_top_srcdir=\'..\' >> atconfig
          echo abs_top_srcdir=\'$(pwd)/..\' >> atconfig
          echo at_top_build_prefix=\'../\' >> atconfig
          echo abs_top_builddir=\'$(pwd)/..\' >> atconfig
          echo at_top_builddir=\$at_top_build_prefix >> atconfig
          echo EXEEXT=\'.exe\' >> atconfig
          echo AUTOTEST_PATH=\'tests\' >> atconfig
          echo SHELL=\${CONFIG_SHELL-\'/bin/sh\'} >> atconfig
          echo m4_define\([AT_PACKAGE_STRING], [$GC_VERSION]\) > package.m4
          echo m4_define\([AT_PACKAGE_BUGREPORT], [bug-gnucobol@gnu.org]\) >> package.m4
          sed 's/x64\/Debug/${{ env.ARCHDIR }}\/${{ matrix.target }}/g' atlocal_win > atlocal
          echo "CI environment MSVC: ${{ env.ARCHDIR }}\/${{ matrix.target }} configured."  > ../config.log
          cat ../build_windows/config.h >> ../config.log
          autom4te --lang=autotest -I ./testsuite.src ./testsuite.at -o ./testsuite

      - name: Run testsuite
        run: |
          rem Needed for now because the paths compiled in have trailing slashes - cl.exe does not like that
          set COB_CFLAGS=/I"%GITHUB_WORKSPACE%" /I"%GITHUB_WORKSPACE%\build_windows"
          rem Needed so mpir.h can be found
          set CL=/I "%VCPKG_ROOT%\installed\${{ matrix.arch }}-windows\include"
          call "%VCVARS%"
          cd tests
          rem Instruct the MSYS2 shell to preserve the current PATH
          set MSYS2_PATH_TYPE=inherit
          C:\shells\msys2bash.cmd -c "./testsuite --jobs=4 || ./testsuite --recheck --verbose"

      - name: Upload testsuite.log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: testsuite-${{ matrix.arch }}-${{ matrix.target }}.log
          path: tests/testsuite.log

      - name: Package GnuCOBOL and dependencies
        run: |
          echo Export VCPKG dependencies
          vcpkg export %VCPKGS% --raw --output=export
          set "VCPKG_EXPORT_DIR=%VCPKG_ROOT%\export"
          echo Wrap up VCPKG dependencies for separate download
          7z a -r -mx=9 dependencies-${{ matrix.arch }}-${{ matrix.target }}.7z "%VCPKG_EXPORT_DIR%"
          echo Wrap up GnuCOBOL binary package
          rem Needed until gcvsvars.cmd is updated
          call "%VCVARS%"
          cmd /C .\build_windows\makedist.cmd ${{ matrix.target }} <NUL

      - name: Upload dependencies
        uses: actions/upload-artifact@v7
        with:
          path: dependencies-${{ matrix.arch }}-${{ matrix.target }}.7z
          if-no-files-found: error
          archive: false

      - name: Upload distribution
        uses: actions/upload-artifact@v7
        with:
          name: GnuCOBOL-${{ matrix.arch }}-${{ matrix.target }}.7z
          path: build_windows/GnuCOBOL_*.7z
          if-no-files-found: error
