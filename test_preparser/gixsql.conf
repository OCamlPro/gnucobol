# GnuCOBOL external preparser configuration for GixSQL
#
# This file is loaded by cobc via --preparser=gixsql
# It registers the GixSQL ESQL preprocessor (gixpp) as an
# external preparser for EXEC SQL ... END-EXEC blocks.
#
# Fields:
#   subsystem   - the EXEC tag to intercept (e.g. "SQL" for EXEC SQL)
#   command     - the external command to run: <command> <source> <output>
#   cflags      - extra C compiler flags passed to the C compilation step
#   ldflags     - extra linker flags passed to the link step
#   on-error    - "error" (default) or "warn" (fall back to baseline on failure)

subsystem:      SQL
command:        /home/utam1/gnucobol/test_preparser/gixsql_preparse.sh
cflags:         -I/home/utam1/gixsql-1.0.20b/runtime/libgixsql
ldflags:        -L/home/utam1/gixsql-1.0.20b/runtime/libgixsql/.libs -lgixsql -L/home/utam1/gixsql-1.0.20b/runtime/libgixsql-sqlite/.libs -lgixsql-sqlite
on-error:       warn
