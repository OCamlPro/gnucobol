# GnuCOBOL external preparser configuration for CICS (mock)
#
# This simulates an IBM CICS preprocessor registration.
# In the mainframe pipeline: CICS is processed BEFORE SQL
# (the order is: EXEC CICS → EXEC SQL → cobc).
#
# When cobc encounters EXEC CICS, it delegates to this mock
# preprocessor, which transforms CICS blocks into CALL statements
# and passes EXEC SQL blocks through untouched for the SQL
# preparser to handle on the next pass.

subsystem:      CICS
command:        /home/utam1/gnucobol/test_preparser/mock_cics_preparse.sh
on-error:       warn
